[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "fastatoms"
version = "0.1.0"
description = "ASE-like Atoms container implemented in C++ with fast extxyz I/O"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
ase = ["ase>=3.22"]
test = ["pytest", "ase>=3.22"]

[tool.scikit-build]
wheel.packages = ["python/fastatoms"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
